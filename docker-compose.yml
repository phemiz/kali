version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: naijaplate
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
    environment:
      PORT: 4000
      NODE_ENV: development
      JWT_SECRET: dev-secret-change
      JWT_EXPIRES_IN: 7d
      DATABASE_URL: postgres://postgres:postgres@db:5432/naijaplate
      B2B_DEFAULT_RATE_LIMIT_PER_MINUTE: 60
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node dist/scripts/migrate.js && node dist/index.js"
    volumes:
      - ./backend/.env:/app/.env:ro
volumes:
  dbdata:
